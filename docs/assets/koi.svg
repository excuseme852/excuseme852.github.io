<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40">
  <!-- Koi facing right (Phase 11): flowing tail, scales, fins, whiskers -->
  <defs>
    <linearGradient id="koi-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2502c"/>
      <stop offset="0.6" stop-color="#f27a3c"/>
      <stop offset="1" stop-color="#fbc590"/>
    </linearGradient>
    <pattern id="koi-scales" width="5" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q 2.5 0.5 5 4" fill="none" stroke="#b33b1f" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>
  <!-- Tail: two flowing lobes with fin rays -->
  <path d="M24 20 C 16 14, 10 6, 2 4 C 6 10, 8 15, 10 20 C 8 25, 6 30, 2 36 C 10 34, 16 26, 24 20 Z"
        fill="#f0703a" stroke="#b33b1f" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M20 19 L 6 8 M20 20 L 8 20 M20 21 L 6 32" stroke="#b33b1f" stroke-width="0.7" opacity="0.6"/>
  <!-- Dorsal fin -->
  <path d="M30 11 C 36 2, 48 1, 56 9 C 48 8, 38 9, 30 11 Z" fill="#f0703a" stroke="#b33b1f" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Body -->
  <path d="M22 20 C 26 10, 44 8, 58 10 C 68 12, 74 16, 75 20 C 74 25, 68 28, 58 30 C 44 32, 26 30, 22 20 Z"
        fill="url(#koi-body)" stroke="#b33b1f" stroke-width="1.3"/>
  <path d="M26 20 C 30 12, 46 11, 58 12 C 62 16, 62 24, 58 28 C 46 29, 30 28, 26 20 Z" fill="url(#koi-scales)"/>
  <!-- Head: lighter, with gill line, eye and whiskers -->
  <path d="M60 11 C 68 13, 74 17, 75 20 C 74 24, 68 28, 60 29 C 63 24, 63 16, 60 11 Z" fill="#f59a5a"/>
  <path d="M60 12 C 63 17, 63 23, 60 28" fill="none" stroke="#b33b1f" stroke-width="1"/>
  <circle cx="68" cy="17" r="2.4" fill="#2b1d33"/>
  <circle cx="68.8" cy="16.2" r="0.8" fill="#fff"/>
  <path d="M74 22 C 77 24, 78 28, 75 31 M72 23 C 73 27, 72 31, 69 33" fill="none" stroke="#b33b1f" stroke-width="1" stroke-linecap="round"/>
  <!-- Pectoral fin -->
  <path d="M50 27 C 54 33, 48 38, 42 34 C 45 33, 48 30, 50 27 Z" fill="#f59a5a" stroke="#b33b1f" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
