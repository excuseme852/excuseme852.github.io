<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藉口生成器 / Excuse Me</title>
  <!-- Link-preview crawlers don't run JavaScript, so these are written here in both languages
       instead of coming from the locale files (main.js still localizes the title/description). -->
  <meta name="description" content="講個情況，揀個風格，大仙即刻賜你一個藉口。Tell the immortal your situation and get a ready-made excuse.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://excuseme852.github.io/">
  <meta property="og:title" content="藉口生成器 Excuse Me">
  <meta property="og:description" content="快啲入嚟問喇，大仙好靈架 · Ask the immortal for the perfect excuse.">
  <meta property="og:image" content="https://excuseme852.github.io/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="卡通大仙坐喺祥雲上面，旁邊有塊木牌 / A cartoon immortal on a cloud beside a wooden plaque">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons and Add to Home Screen -->
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#6b3fa0">
  <!-- Plaque font (LXGW WenKai TC). Google serves only the character slices a page uses;
       no user text is sent. Falls back to system Kaiti / sans if it can't load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body data-state="loading">
  <!-- Background scene: starlight, floating cloud, koi, and the immortal hiding behind the cloud -->
  <div class="scene">
    <div class="rays" aria-hidden="true">
      <span class="ray"></span><span class="ray"></span><span class="ray"></span><span class="ray"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
    </div>
    <div class="cloud-group">
      <div id="immortal" class="immortal" role="img" data-i18n-aria-label="stage.immortalLabel"></div>
      <div class="puff" aria-hidden="true"><span></span><span></span><span></span></div>
      <img class="cloud" src="./assets/cloud.svg" alt="">
      <div class="thought" aria-hidden="true"><span id="thought-text" class="thought-text"></span></div>
      <div class="say-bubble" role="status" aria-live="polite"><span id="say-text"></span></div>
      <p id="thinking-bubble" class="thinking-bubble"></p>
      <div class="koi-track" aria-hidden="true">
        <div class="koi-x"><div class="koi-y"><img class="koi" src="./assets/koi.svg" alt=""></div></div>
      </div>
      <div class="koi-track koi-track--second" aria-hidden="true">
        <div class="koi-x"><div class="koi-y"><img class="koi" src="./assets/koi.svg" alt=""></div></div>
      </div>
      <div class="koi-track koi-track--third" aria-hidden="true">
        <div class="koi-x"><div class="koi-y"><img class="koi" src="./assets/koi.svg" alt=""></div></div>
      </div>
    </div>
  </div>

  <!-- Only shown if no language file could load, so it can't come from a locale file -->
  <p id="boot-error" class="boot-error" role="alert" hidden>載入失敗，請重新整理。<br>Couldn't load. Please refresh.</p>

  <div class="app">
    <header class="topbar">
      <button id="lang-toggle" class="lang-toggle" type="button"
              data-i18n="lang.toggle" data-i18n-aria-label="lang.toggleLabel"></button>
    </header>

    <main class="home">
      <h1 class="app-title" data-i18n="app.title"></h1>

      <form id="ask-form" class="ask-form" novalidate>
        <label for="situation" class="prompt" data-i18n="home.prompt"></label>
        <div class="input-wrap">
          <textarea id="situation" name="situation" rows="4"
                    data-i18n-placeholder="home.placeholder"
                    aria-describedby="char-counter form-message"></textarea>
          <p id="char-counter" class="char-counter" aria-live="polite" hidden></p>
        </div>

        <fieldset id="topics" class="topics" hidden>
          <legend class="styles-legend" data-i18n="home.topicLegend"></legend>
          <div id="topic-options" class="topic-options"></div>
        </fieldset>

        <fieldset class="styles">
          <legend class="styles-legend" data-i18n="home.styleLegend"></legend>
          <div class="style-options">
            <label class="style-option">
              <input type="radio" name="style" value="polite" checked>
              <span class="style-chip" data-i18n="style.polite"></span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="funny">
              <span class="style-chip" data-i18n="style.funny"></span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="ridiculous">
              <span class="style-chip" data-i18n="style.ridiculous"></span>
            </label>
          </div>
        </fieldset>

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="ask-button" data-i18n="home.submit"></button>
      </form>
    </main>

    <section class="stage" aria-live="polite">

      <div class="result">
        <div id="result-plaque" class="plaque" tabindex="-1" role="group" data-i18n-aria-label="stage.plaqueLabel">
          <div class="plaque-inner">
            <div class="plaque-face plaque-front">
              <p id="plaque-label" class="plaque-label" data-i18n="stage.resultLabel"></p>
              <p id="plaque-text" class="plaque-text"></p>
            </div>
            <div class="plaque-face plaque-back" aria-hidden="true">
              <!-- Chinese knot medallion -->
              <svg viewBox="0 0 72 72" focusable="false">
                <circle cx="36" cy="36" r="32" fill="none" stroke="#f0c14b" stroke-width="3"/>
                <circle cx="36" cy="36" r="27" fill="none" stroke="#f0c14b" stroke-width="1.2" opacity="0.6"/>
                <g fill="none" stroke="#f0c14b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
                  <path d="M36 18 L 54 36 L 36 54 L 18 36 Z"/>
                  <path d="M27 27 L 45 45 M45 27 L 27 45 M31.5 22.5 L 49.5 40.5 M40.5 22.5 L 22.5 40.5 M22.5 31.5 L 40.5 49.5 M49.5 31.5 L 31.5 49.5"/>
                  <circle cx="36" cy="14" r="4"/>
                  <circle cx="58" cy="36" r="4"/>
                  <circle cx="36" cy="58" r="4"/>
                  <circle cx="14" cy="36" r="4"/>
                </g>
              </svg>
            </div>
          </div>
        </div>
        <div class="result-actions">
          <button id="copy-button" class="action-button" type="button" data-i18n="actions.copy"></button>
          <button id="another-button" class="action-button" type="button" data-i18n="actions.another"></button>
          <button id="share-button" class="action-button" type="button" data-i18n="actions.share"></button>
        </div>
        <div class="result-footer">
          <button id="back-button" class="back-button" type="button" data-i18n="stage.back"></button>
          <a id="feedback-link" class="feedback-link feedback" target="_blank" rel="noopener" data-i18n="feedback.button" hidden></a>
          <p class="feedback-note feedback" data-i18n="feedback.note" hidden></p>
        </div>
      </div>

      <div class="error-actions">
        <button id="retry-button" class="action-button" type="button" data-i18n="stage.retry"></button>
        <button id="error-back-button" class="back-button" type="button" data-i18n="stage.back"></button>
      </div>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>

      <button id="skip-button" class="skip-button" type="button" data-i18n-aria-label="stage.skip">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>
  </div>
</body>
</html>
