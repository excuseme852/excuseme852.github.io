<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>藉口生成器 / Excuse Me</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body data-state="loading">
  <!-- Background scene: starlight, floating cloud, koi, and the immortal hiding behind the cloud -->
  <div class="scene">
    <div class="rays" aria-hidden="true">
      <span class="ray"></span><span class="ray"></span><span class="ray"></span><span class="ray"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span>
    </div>
    <div class="cloud-group">
      <div id="immortal" class="immortal" role="img" data-i18n-aria-label="stage.immortalLabel"></div>
      <div class="puff" aria-hidden="true"><span></span><span></span><span></span></div>
      <img class="cloud" src="./assets/cloud.svg" alt="">
      <div class="koi-track" aria-hidden="true">
        <div class="koi-x"><div class="koi-y"><img class="koi" src="./assets/koi.svg" alt=""></div></div>
      </div>
      <div class="koi-track koi-track--second" aria-hidden="true">
        <div class="koi-x"><div class="koi-y"><img class="koi" src="./assets/koi.svg" alt=""></div></div>
      </div>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <button id="lang-toggle" class="lang-toggle" type="button"
              data-i18n="lang.toggle" data-i18n-aria-label="lang.toggleLabel"></button>
    </header>

    <main class="home">
      <h1 class="app-title" data-i18n="app.title"></h1>

      <form id="ask-form" class="ask-form" novalidate>
        <label for="situation" class="prompt" data-i18n="home.prompt"></label>
        <div class="input-wrap">
          <textarea id="situation" name="situation" rows="4"
                    data-i18n-placeholder="home.placeholder"
                    aria-describedby="char-counter form-message"></textarea>
          <p id="char-counter" class="char-counter" aria-live="polite" hidden></p>
        </div>

        <fieldset class="styles">
          <legend class="styles-legend" data-i18n="home.styleLegend"></legend>
          <div class="style-options">
            <label class="style-option">
              <input type="radio" name="style" value="polite" checked>
              <span class="style-chip" data-i18n="style.polite"></span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="funny">
              <span class="style-chip" data-i18n="style.funny"></span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="ridiculous">
              <span class="style-chip" data-i18n="style.ridiculous"></span>
            </label>
          </div>
        </fieldset>

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

        <button type="submit" class="ask-button" data-i18n="home.submit"></button>
      </form>
    </main>

    <section class="stage" aria-live="polite">
      <p class="thinking-bubble" data-i18n="stage.thinking"></p>

      <div class="result">
        <div id="result-card" class="result-card" tabindex="-1">
          <p class="result-label" data-i18n="stage.resultLabel"></p>
          <p class="result-text" data-i18n="sample.excuse"></p>
        </div>
        <button id="back-button" class="back-button" type="button" data-i18n="stage.back"></button>
      </div>

      <button id="skip-button" class="skip-button" type="button" data-i18n-aria-label="stage.skip">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>
  </div>
</body>
</html>
